[LilyGo_TDeck]
extends = esp32_base
board = t-deck
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/lilygo_tdeck
  -D LILYGO_TDECK
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_USER_BTN=0  ; Trackball button
  -D PIN_PERF_POWERON=10 ; Peripheral power pin
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D P_LORA_DIO_1=45 ; LORA IRQ pin
  -D ENV_INCLUDE_GPS=1
  -D ENV_SKIP_GPS_DETECT=1  ; GPS always present on T-Deck; skip the flaky 1s boot-time Serial1.available() detect race that intermittently left the GPS toggle dead ("no fix until toggled a few times")
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
  -D P_LORA_NSS=9    ; LORA SS pin
  -D P_LORA_RESET=17 ; LORA RST pin
  -D P_LORA_BUSY=13  ; LORA Busy pin
  -D P_LORA_SCLK=40  ; LORA SCLK pin
  -D P_LORA_MISO=38  ; LORA MISO pin
  -D P_LORA_MOSI=41  ; LORA MOSI pin
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D DISPLAY_SCALE_X=2.5
  -D DISPLAY_SCALE_Y=3.75
  -D PIN_TFT_RST=-1
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=42
  -D PIN_TFT_CS=12
  -D PIN_TFT_DC=11
  -D PIN_TFT_SCL=40
  -D PIN_TFT_SDA=41
  -D PIN_GPS_RX=43
  -D PIN_GPS_TX=44
  -D GPS_BAUD_RATE=38400
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tdeck>
  +<helpers/sensors/*.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:LilyGo_TDeck_companion_radio_usb]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I examples/companion_radio/ui-touch
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TDeck_companion_radio_ble]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I examples/companion_radio/ui-touch
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TDeck_repeater]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -D ADVERT_NAME='"TDeck Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  ${esp32_ota.lib_deps}

; ---------------------------------------------------------------------------
; LilyGo T-Deck (Plus) — LVGL TOUCH UI companion radio (the meshcomod touch
; firmware, same UI as heltec_v4_tft_companion_radio_usb_tcp_touch but on the
; T-Deck's hardware). Reuses the Adafruit ST7789LCDDisplay (no TFT_eSPI) and
; the shared touch-input API; touch is a no-op stub for now (GT911 next), so it
; boots and renders before the input drivers land. Keyboard / trackball / SD
; file-manager are T-Deck-only follow-ups.
; ---------------------------------------------------------------------------
[env:LilyGo_TDeck_companion_radio_touch]
extends = LilyGo_TDeck
; Custom 16 MB partition table with the dedicated "tiles" LittleFS partition
; for the map tab (shared layout with the Heltec V4 touch build).
board_build.partitions = variants/lilygo_tdeck/partitions_tdeck_touch.csv
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I include
  -I examples/companion_radio/ui-touch
  -D UI_LVGL=1
  -D HAS_TOUCH_UI=1
  ; OTA: this env's published .bin name (under prebuilt/releases/TOUCH/<tag>/),
  ; so the on-device "Install update" button can fetch the right image.
  -D FIRMWARE_OTA_ENV='"LilyGo_TDeck_companion_radio_touch"'
  -D HAS_TDECK_GT911=1
  -D HAS_TDECK_TRACKBALL=1
  -D HAS_TDECK_KEYBOARD=1
  -D ENABLE_ADVERT_ON_BOOT=0   ; no automatic self-advert on boot (overrides arduino_base)
  ; Trackball direction GPIOs (native portrait frame): up/down/left/right.
  -D PIN_TB_UP=15
  -D PIN_TB_DOWN=3
  -D PIN_TB_LEFT=2
  -D PIN_TB_RIGHT=1
  -D LV_CONF_PATH=lv_conf.h
  -D LV_CONF_INCLUDE_SIMPLE=1
  -D MAX_CONTACTS=2000
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D ADMIN_PASSWORD='"password"'
  -D MULTI_TRANSPORT_COMPANION=1
  -D TCP_PORT=5000
  -D WS_PORT=8765
  -D BLE_PIN_CODE=123456
  ; Plain ws:// only (no WSS): smaller image, more internal RAM for HTTPS OTA.
  -D CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=1
  -D CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  -D CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/input/*.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-touch/*.cpp>
  +<../examples/companion_radio/ui-touch/*.c>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  ${esp32_ota.lib_deps}
  lvgl/lvgl @ ^8.3.11
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TDeck_kiss_modem]
extends = LilyGo_TDeck
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<../examples/kiss_modem/>
