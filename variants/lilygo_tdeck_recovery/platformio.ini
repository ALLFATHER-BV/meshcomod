; ---------------------------------------------------------------------------
; meshcomod_boot — on-device recovery / backup / firmware-switch firmware for
; the LilyGo T-Deck (ESP32-S3, 16 MB). A clean-room, STANDALONE Arduino app
; (Adafruit ST7789 + the copied TDeck trackball/keyboard drivers); it does NOT
; use the MeshCore core in src/, so this env replaces the inherited
; build_src_filter / lib_deps and compiles only examples/meshcomod_boot/src/.
;
; On-device model: this recovery runs from the `factory` partition; the
; companion firmware lives in `ota_0` (see examples/meshcomod_boot/partitions.csv).
; It does whole-flash SD backup + verify + restore; full-clone restore is a
; host job (examples/meshcomod_boot/restore.sh). See
; examples/meshcomod_boot/docs/ARCHITECTURE.md.
;
;   build:  pio run -e LilyGo_TDeck_recovery
;   merge:  pio run -t mergebin -e LilyGo_TDeck_recovery
; ---------------------------------------------------------------------------
[env:LilyGo_TDeck_recovery]
extends = esp32_base
board = t-deck
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = examples/meshcomod_boot/partitions_shared.csv
build_flags =
  -w
  -D LILYGO_TDECK
  -D BOARD_HAS_PSRAM=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; T-Deck pins (shared bus: TFT + LoRa + SD on SCLK/MOSI = 40/41)
  -D PIN_PERIPH_POWER=10
  -D PIN_TFT_CS=12
  -D PIN_TFT_DC=11
  -D PIN_TFT_BL=42
  -D PIN_SPI_SCLK=40
  -D PIN_SPI_MOSI=41
  -D PIN_SPI_MISO=38
  -D PIN_LORA_NSS=9
  -D PIN_SD_CS=39
  -D HAS_TDECK_TRACKBALL=1
  -D HAS_TDECK_KEYBOARD=1
  -I examples/meshcomod_boot/src
; Compile ONLY the recovery app — drop the MeshCore core that the inherited
; filter would pull in.
build_src_filter =
  -<*>
  +<../examples/meshcomod_boot/src/>
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  bblanchon/ArduinoJson @ ^6.21.5
