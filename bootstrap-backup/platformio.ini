[platformio]
default_envs = heltec_v4_touch_dev

; This is a starter config for a dedicated Heltec V4 Touch repo.
; Adjust board id, libraries, and pins to match your exact hardware revision.
[env]
platform = espressif32@^6.7.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D MESHCOMOD_TOUCH=1
  -D HELTEC_V4_TOUCH=1
  -D COMPANION_USB=1
  -D COMPANION_BLE=1
  -D COMPANION_TCP=1
  -D TOUCH_CONTROLLER_CHSC6X=1
  -D TOUCH_SDA_PIN=47
  -D TOUCH_SCL_PIN=48
  -D TOUCH_RST_PIN=44

[env:heltec_v4_touch_dev]
build_type = debug
build_flags =
  ${env.build_flags}
  -D LOG_LEVEL=5
  -D TOUCH_UI_DEV_MODE=1
  -D MESHCOMOD_ENV_NAME=\"heltec_v4_touch_dev\"

[env:heltec_v4_touch_release]
build_type = release
build_flags =
  ${env.build_flags}
  -D LOG_LEVEL=2
  -D TOUCH_UI_DEV_MODE=0
  -D MESHCOMOD_ENV_NAME=\"heltec_v4_touch_release\"

; Keep this env for pipeline compatibility where "merged" appears as a distinct target.
; The build script calls -t mergebin on the release env to produce merged output.
[env:heltec_v4_touch_release_merged]
extends = env:heltec_v4_touch_release
build_flags =
  ${env:heltec_v4_touch_release.build_flags}
  -D MESHCOMOD_ENV_NAME=\"heltec_v4_touch_release_merged\"

; Transitional alias from your existing branch naming.
[env:heltec_v4_tft_companion_radio_usb_tcp_touch]
extends = env:heltec_v4_touch_release
build_flags =
  ${env:heltec_v4_touch_release.build_flags}
  -D MESHCOMOD_LEGACY_ENV_ALIAS=1
