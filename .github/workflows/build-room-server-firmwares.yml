name: Build Room Server Firmwares

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'room-server-*'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:

      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        env:
          FIRMWARE_VERSION: ${{ env.GIT_TAG_VERSION }}
        run: /usr/bin/env bash build.sh build-room-server-firmwares

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: room-server-firmwares
          path: out

      # Published (not draft): GitHub Releases are the distribution source of
      # truth — the web flasher reads the release assets directly.
      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Room Server Firmware ${{ env.GIT_TAG_VERSION }}
          body: ""
          draft: false
          files: out/*

      # Rolling retention: keep the newest 5 room-server releases, prune older
      # ones (release + tag + assets).
      - name: Prune old releases (keep last 5)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/env bash scripts/ci/prune-releases.sh "room-server-" 5