name: Setup Build Environment
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # Tags like companion-v1.14.0.35 must yield FIRMWARE_VERSION=v1.14.0.35 (not just the last segment).
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # Triggered by a tag push. Strip the KNOWN track prefix rather than cutting
          # at the last '-', so multi-dash tracks (room-server-) survive intact.
          GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
          case "$GIT_TAG_NAME" in
            companion-*)    VERSION_STRING="${GIT_TAG_NAME#companion-}" ;;
            repeater-*)     VERSION_STRING="${GIT_TAG_NAME#repeater-}" ;;
            room-server-*)  VERSION_STRING="${GIT_TAG_NAME#room-server-}" ;;
            *)              VERSION_STRING="${GIT_TAG_NAME##*-}" ;;
          esac
        else
          # triggered by a workflow dispatch (e.g: refs/heads/main)
          # strip "refs/heads/" prefix and replace any remaining "/" with "-" to protect file paths
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION_STRING=$(echo "$BRANCH_NAME" | tr '/' '-')
        fi
        echo "GIT_TAG_VERSION=${VERSION_STRING}" >> "$GITHUB_ENV"
