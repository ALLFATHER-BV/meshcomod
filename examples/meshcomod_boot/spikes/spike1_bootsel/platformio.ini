; meshcomod_boot — Spike 1: bootloader-stage app selection (GPIO -> recovery)
;
; Pure ESP-IDF on purpose: this isolates the ONE thing we're de-risking (does the
; stock 2nd-stage bootloader divert the boot to a 'test' partition when a GPIO is
; held?) from the Arduino+IDF hybrid build we'll use for the real recovery UI.
;
; The whole spike is a single tiny app flashed to BOTH the 'factory' (MAIN) and
; 'test' (RECOVERY) partitions; it prints which one the bootloader chose. See
; SPIKE1.md.

[env:spike1_tdeck]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_spike1.csv
monitor_speed = 115200
; The partition table MUST come from board_build.partitions above -- that's
; PlatformIO's mechanism. Setting only CONFIG_PARTITION_TABLE_CUSTOM_FILENAME in
; sdkconfig is silently ignored under PlatformIO (it falls back to single-app).
; The BOOTLOADER_APP_TEST GPIO + 16MB flash live in sdkconfig.defaults, since
; ESP-IDF builds the bootloader from source so those options take effect.
