; meshcomod_boot recovery — Arduino framework, matching Meshcomod_Touch so we reuse
; its T-Deck UI base (Adafruit ST7789 display bring-up + the TDeck* input drivers)
; and get USB-CDC auto-reset flashing (after this build, no more manual download mode)
; plus a serial monitor that doesn't reset the board.
;
; Milestone 2: on-screen full-flash backup to SD. (Menu/inputs + restore next.)

[env:tdeck]
platform = platformio/espressif32@6.11.0
framework = arduino
board = t-deck
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
  -DLILYGO_TDECK
  -DBOARD_HAS_PSRAM=1
  -DARDUINO_USB_CDC_ON_BOOT=1        ; USB CDC console -> auto-reset flashing, no reset-on-open
  ; T-Deck pins (reused from Meshcomod_Touch/variants/lilygo_tdeck)
  -DPIN_PERIPH_POWER=10              ; peripheral power rail
  -DPIN_TFT_CS=12
  -DPIN_TFT_DC=11
  -DPIN_TFT_BL=42                    ; backlight (PIN_TFT_LEDA_CTL)
  -DPIN_SPI_SCLK=40                  ; shared bus: TFT + LoRa + SD
  -DPIN_SPI_MOSI=41
  -DPIN_SPI_MISO=38
  -DPIN_LORA_NSS=9                   ; deselected during SD/TFT use
  -DPIN_SD_CS=39
  ; reused T-Deck input drivers (pin defaults in the drivers match the hardware)
  -DHAS_TDECK_TRACKBALL=1
  -DHAS_TDECK_KEYBOARD=1
lib_deps =
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
