; meshcomod_boot — custom 2nd-stage bootloader (launcher model).
; Builds ONLY to produce bootloader.bin; the placeholder app is unused. The real
; recovery (factory) + firmware (ota_0) apps are the Arduino builds, flashed
; separately. This bootloader reads them at runtime from the partition table.

[env:bootloader]
platform = espressif32@6.12.0
framework = espidf
board = t-deck
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
